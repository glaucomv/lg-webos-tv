<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('fmtv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <div id="wallpaper" class="layer">
      <div id="wallA" class="wall-pane"><canvas class="wall-ambilight" width="64" height="36"></canvas><div class="wall-fg"></div></div>
      <div id="wallB" class="wall-pane"><canvas class="wall-ambilight" width="64" height="36"></canvas><div class="wall-fg"></div></div>
      <div class="wall-mask"></div>
    </div>
    <canvas id="bgA" width="48" height="27" style="display:none"></canvas>
    <canvas id="bgB" width="48" height="27" style="display:none"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title" style="display:none"></h1>
      <div id="tabs" style="display:none"></div>
      <div id="quotes" style="display:none"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
      <div id="weather-badge" style="display:none">
        <span class="wx-icon sym"></span>
        <span class="wx-temp"></span>
        <span class="wx-city"></span>
      </div>
      <div id="buttons"></div>
      <div id="spotlight">
        <div id="spot-info">
          <div id="spot-badge"></div>
          <h2 id="spot-title"></h2>
          <p id="spot-desc"></p>
          <div id="spot-hint"></div>
        </div>
        <div id="spot-preview-box">
          <div class="preview-frame">
            <video id="tv-live-preview" autoplay muted playsinline></video>
            <div id="app-preview-img"></div>
            <div class="preview-badge"><span id="preview-pulse-dot" class="preview-pulse"></span><span id="preview-badge-text">AO VIVO</span></div>
            <div class="preview-bar">
              <span class="preview-title" id="preview-channel-name">Sintonizador TV Aberta</span>
              <span class="preview-sub" id="preview-sub-text">Pressione OK para tela cheia</span>
            </div>
          </div>
        </div>
      </div>
      <div id="cards" style="display:none"></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="poweronpick" class="layer sheet"><div class="box"></div></div>
  <div id="usbpick" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
